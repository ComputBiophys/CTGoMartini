[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctgomartini"
version = "1.0.0"
description = "CTGoMartini - A Python Library For Protein Conformational Transitions"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Song Yang", email = "yangsong2015@pku.edu.cn"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "MDAnalysis>=2.4",
    "numpy>=2.0,<2.4.0",
    "pandas",
    "matplotlib>=3.3.3",
    "vermouth==0.14.0",
    "openmm>=8.1",
]

[project.optional-dependencies]
plumed = ["openmm-plumed>=2.0.0"]
dssp = ["dssp<4.0"]
vermouth-warning = []  # Placeholder for vermouth compatibility notes
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
ctgomartinize = "ctgomartini.cli.ctgomartinize:main"
run_ctgomartini = "ctgomartini.cli.run_ctgomartini:main"

[project.urls]
Homepage = "https://github.com/ComputBiophys/CTGoMartini"
Repository = "https://github.com/ComputBiophys/CTGoMartini"
Documentation = "https://github.com/ComputBiophys/CTGoMartini#readme"
"Bug Tracker" = "https://github.com/ComputBiophys/CTGoMartini/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctgomartini*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
ctgomartini = ["data/**/*"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    Tutorial
)/
'''

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D"]  # Don't require docstrings in tests

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "Tutorial/",
]
