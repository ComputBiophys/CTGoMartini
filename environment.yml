name: ctgomartini
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.14
  
  # OpenMM >= 8.6 (provides the built-in REMD backend) and CUDA
  - openmm>=8.6
  - cuda-version=12
  
  # REMD MBAR analysis
  - pymbar
  - numpy>=2.0
  
  # Jupyter for analysis
  - jupyter
  
  # Pip for remaining packages
  - pip
  - pip:
    - MDAnalysis>=2.4
    - pandas
    - matplotlib>=3.3.3
    - vermouth==0.14.0
    - mdtraj
    - pytest>=7.0
    - pytest-cov
    - black
    - ruff
    - mypy
